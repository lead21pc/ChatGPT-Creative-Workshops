anti_drift_configuration: >-
  Experiment switch: use only the status of the three anti-drift entries below, not source presence or a runtime
  selector. BASELINE = all three INACTIVE; A = only HUB-DOM-ANTI-PRIOR ACTIVE; B = only
  HUB-DOM-MODULAR-CONCEPT-ARCHITECTURE and HUB-DOM-WORLDBUILDING-INTERNAL-LOGIC ACTIVE.
  Missing, duplicate or unsupported status entries, an incomplete B pair, or A ACTIVE with either B member ACTIVE
  are configuration errors. Block only anti-drift-dependent portions; select no winner or fallback. Check this
  metadata before reading anti-drift bodies. Status enables eligibility, never task selection. Never read the
  inactive alternative. WIL is dependency-only, never independently selected. B selects MCA, whose one-way
  Requires closure must fully verify WIL before either executes on the same matched portion. A failed companion
  blocks B, never permits MCA-only execution. Reassess on every material task/scope change; no persistent mode.
  Deployment must align the exact catalog, core and selected module content in Central Hub Config. All three
  module artifacts carry eligible Status ACTIVE; their catalog entries default INACTIVE for the baseline.
  Change only these three catalog statuses together to configure a test; do not change Creative/Brainstorm.
  Unobserved Library identities remain unresolved; neither configuration nor repository files prove deployment.
