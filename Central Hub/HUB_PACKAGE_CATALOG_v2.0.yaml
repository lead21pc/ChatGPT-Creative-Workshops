    status: ACTIVE
    version: '0.3'
    location:
      class: LIBRARY
      root: Central Hub Config
      artifact: ImageT/HUB-IMAGET-CATALOG_v0.3.yaml
  requires: []
  binding_mode: LIBRARY_MODULE
