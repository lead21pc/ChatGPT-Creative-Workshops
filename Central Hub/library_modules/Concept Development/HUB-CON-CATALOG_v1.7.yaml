- module_id: HUB-CON-AD-ANTI-PRIOR
  package_id: HUB-PKG-CONCEPT-DEVELOPMENT
  runtime_role: DOMAIN_CONTROL
  status: ACTIVE
  version: '1.3'
  applicability: Select when a familiar prior, label, aesthetic, prestige or observable signal risks supplying an unsupported
    material premise, mechanism, capability, authority or value in the current portion. Includes surface substitution
    even when other premises are complete. Do not select for surface description alone, explicit user/ontology-defined
    mappings, authorized blank-slate invention or a requested conventional trope absent a different undeclared material
    link. Non-implication is not prohibition or inverted prior.
