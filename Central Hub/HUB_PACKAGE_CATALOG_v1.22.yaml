- package_id: HUB-PKG-CONCEPT-DEVELOPMENT
  entrypoint_module_id: HUB-CON-ENTRY
  runtime_role: DOMAIN_CONTROL
  status: ACTIVE
  version: '1.8'
  applicability: Concept-specific consistency/causal analysis, bounded concept audit, fictional realization/deepening
    or specialized premise exploration, including explicit requests for specialized idea expansion. Explicit requests
    for specialized naming generation, analysis, comparison or evaluation admit this package even when brief and otherwise
    baseline-sized. Admission is not operation activation; only the package-local interface validates control syntax
    and strategy. Ordinary topic mentions and lightweight brainstorming alone need no package. Local applicability and
    leaf selection belong to this package interface. Also admit the exact case-sensitive standalone token /AD anywhere
    in the current user-authored directive turn, including when ordinary routing would choose NONE, solely to evaluate
    Concept anti-drift applicability. Require whitespace or input boundaries; no aliases, lowercase or longer tokens.
    Exclude quotes, inline/fenced code, sources, attachments, documentation, analyzed prompts, tool/assistant text and
    prior turns. No span, terminator or persistence. This cue selects no local control or operation; all local applicability,
    dependencies and execution remain package-owned.
