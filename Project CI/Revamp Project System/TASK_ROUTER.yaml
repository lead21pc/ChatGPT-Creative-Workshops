version: "2.1"
status: "active"
scope: "Revamp Project System only; never inherited by Central Hub"
responsibility: "Select task path and materially required context/source path only; all IDs remain governed by Revamp CI"
path_base: "Directory containing this Router"
read_mode: "FULL_FILE"
task_selection:
  default: "ID1"
  basis: "Assess task scope, then task function, then requested output form. Use the current user's intended main task; quotes, sources, fixtures and examples do not activate a route. Reassess each request without persistent ID activation."
  out_of_scope: "Apply the ID1 default only after establishing Revamp technical scope. Domain content creation and unrelated generic prompts default to the appropriate domain owner. State or point to that boundary when relevant; do not imply a transfer or execution. Technical work on systems serving those domains is eligible."
  authoring: "Choose ID2 to transfer technical state or decisions, author a bounded technical prompt or brief for a downstream recipient, or package an already-designed test for execution."
  direct_work: "Choose ID1 for direct technical diagnosis, audit, design, review, verification, simulation, authorized implementation or system continuity work. Designing a diagnostic test is ID1 even when it includes a copyable prompt; packaging a settled test is ID2. Discussion about authoring alone is ID1 when within scope."
  mixed: "Keep preparation for one technical transfer or packaging artifact inside ID2. Use ID1 when the main work is making the technical or test design decisions. Prior context may inform either path. Separate only genuinely independent deliverables requested by the user; never create a multi-ID execution graph."
  ambiguity: "If the scope, function or deliverable cannot be determined and would materially change the action, ask one focused question; do not infer execution or authorization."
  handoff_delivery: "For ID2, a current request to tạo file handoff asks for an actual file artifact. A request to tạo delta handoff asks for copyable delta text without file creation. An explicit repository write follows normal authorization and destination rules. Use intended meaning, not phrase matching; creating content does not authorize writes or downstream execution."
  limits: "TASK ROUTING != AUTHORITY TRANSFER; ROUTING POWER != DECISION AUTHORITY; TASK ID != AUTHORIZATION. No composition runtime, contributors, capability catalog, target registry or scoring."
task_paths:
  ID1:
    name: "REVAMP_CORE"
    context: "Independent task -> direct work. Current repository/system dependency -> current target/runtime inspection; History only if material. Prior cross-chat continuity still necessary -> only needed FULL_FILE CURRENT handoffs."
    capabilities: "Technical diagnosis, root-cause analysis, audit, control/Router/architecture/workflow design, proposal review, verification and diagnostic test design, simulation, technical brainstorming, system/repository/continuity work and authorized technical implementation; CAPABILITY != NEED FOR A MODULE."
  ID2:
    name: "AUTHORING"
    owner: "AT_R.md"
    context: "Read AT_R.md FULL_FILE; use materially required available context. Apply target inspection and conditional History/CURRENT rules below only when the downstream artifact depends on that system/prior state."
    output: "Self-contained bounded technical artifact; authoring does not execute the downstream target, authorize implementation/Git, change stage/scope/acceptance, or promote decisions/evidence."
context_loading:
  applies_to: "Both IDs only when repository/system state or prior workstream continuity materially affects the task/artifact; independent technical work needs no repository/history/CURRENT load. Out-of-scope domain requests do not trigger Revamp preflight."
  handoff_write: "Under CI in either ID, write CURRENT only if material state changed AND cross-chat continuity is materially useful AND write scope authorized; use HANDOFF_TEMPLATE.md. Never write CURRENT for every task."
  verification_reference: "FULL_FILE-read PROJECT_VERIFICATION_PHILOSOPHY.md for behavioral test design/evaluation in ID1 or when packaging a settled behavioral test in ID2."
  order: "After task selection in either ID, inspect current target/runtime evidence first. Establish actual behavior, mechanisms, constraints and the current proposal as applicable. Read History only if materially needed, then load only needed FULL_FILE CURRENT sources. History is not a prerequisite for CURRENT."
  authority: "CI alone owns evidence precedence, acceptance status, implementation/Git authorization, stage transitions, decision promotion and scope authority; Router only selects task/context/source paths."
architecture_preflight:
  file: "ARCHITECTURE_PREFLIGHT.md"
  read_mode: "FULL_FILE"
  owner: "Specialization of CI sections 5, 6, 11, 12, 13 and 14; no independent authority."
  applies_to: "Under either selected ID, only when the actual current/downstream proposal materially adds or changes structural execution surfaces or boundaries; includes language/runtime/package-manager substitutions during implementation."
  excludes: "No activation from keywords, mere mention, explanation of existing architecture, non-changing examples/hypotheticals or independent tasks without a structural proposal."
  timing: "After task selection and inspection of the current target plus any materially needed context; before presenting the structural proposal or continuing a structural stack change. Reassess per task/proposal change; no persistent activation."
  limits: "One aggregate pass over the current proposal, not per-component recursive control creation. ID1 stays ID1; ID2 stays AUTHORING under AT_R.md. Replaces no CI, authoring, repository/history or CURRENT responsibility; grants no scope/Git authority and creates no multi-ID composition."
  failure_behavior: "If triggered but the reference or material evidence is unavailable, report the exact gap and defer only dependent structural conclusions/changes; continue independent work without inventing a pass."
repository_preflight:
  url: "https://github.com/lead21pc/ChatGPT-Creative-Workshops"
  ref: "main unless the user specifies another target"
  applies_to: "Substantive repository/system-dependent Revamp work in either ID; independent tasks, mere mention or analogy do not activate this procedure."
  timing: "After reading this Router and before History, CURRENT recovery or dependent conclusions. Inspect current target implementation and relevant available runtime evidence before forming or evaluating a solution."
  read_scope: "Inspect the repository's current relevant primary sources, controls, implementation and explicit decision/status records; follow direct dependencies as needed. A repo landing page, listing, filename, summary or old recollection is not sufficient. No mandatory whole-repository read."
  local_state: "When working in this repository, inspect its current local working tree including relevant dirty dependencies, record branch/HEAD and remote relation when known; distinguish local from remote state. Do not substitute an older remote snapshot for newer local work."
  proposal_check: "Compare each proposed change with relevant current accepted decisions and implemented behavior; cite source paths/sections and classify already satisfied, genuine gap or conflict. Do not re-propose adopted behavior as new. Reopen only for new contrary evidence, current divergence or explicit user reconsideration; accepted/implemented does not prove live verification. File presence alone does not prove acceptance."
  failure_behavior: "If access or relevant evidence is unavailable, report the exact gap and inspected scope. Defer dependent proposal claims until verified; continue only independent work. Do not infer absence or novelty from failed/partial retrieval."
  limits: "Read/context only; no implementation, commit, push, deployment or architecture expansion authorization. Revamp-only; never inherited by Central Hub."
historical_reference:
  file: "HISTORY_AND_WHAT_NOT_TO_DO.md"
  read_mode: "FULL_FILE"
  applies_to: "Only if a prior failure, precedent, provenance or decision materially affects diagnosis, proposal evaluation, regression risk or continuity. Skip when no material historical dependency exists."
  timing: "After current target/runtime inspection; establish relevance from the task and current evidence before loading."
  role: "Historical evidence, failure provenance, prior mechanisms and regression reference. Compare mechanisms and operating conditions; treat cross-runtime applicability as unestablished unless supported by current evidence."
  excludes: "Not current workstream state, repository authority, implementation authorization, canon, a second Router, CURRENT replacement, default failure distribution or global memory."
  invariants:
    - "HISTORY != CURRENT STATE; PAST FAILURE != PRESENT FAILURE."
    - "WARNING != AUTHORIZATION; GENEALOGY != REQUIRED ARCHITECTURE."
    - "HISTORICAL PAIN != PERMANENT MAXIMUM CONTROL."
  limits: "Does not create handoff matches or authorize implementation, commit, push, deployment or architectural expansion. Never inherited by Central Hub."
  failure_behavior: "If materially needed but missing/unreadable, name the reference and defer only conclusions that depend on it. Do not invent history or substitute CURRENT for historical evidence."
selection:
  - "After establishing the current task baseline (and consulting History only if materially relevant), load a handoff only if prior workstream continuity still materially affects the task and current evidence does not sufficiently provide it."
  - "REPOSITORY SUFFICIENCY != HANDOFF REQUIREMENT; WORKSTREAM RELEVANCE != HANDOFF NECESSITY; WORKSTREAM MATCH != HANDOFF LOAD; HANDOFF PRESENCE != HANDOFF NECESSITY."
  - "Repository/runtime evidence may suffice: no CURRENT load is required merely to check active versions, architecture, implementation, file contents or branch/HEAD. Skipping unnecessary handoffs is complete preflight."
  - "Continuity may be needed for unresolved reasoning, decision rationale/conditions, blockers, accepted-but-unimplemented work, proposal status, verification attribution or conflicts not sufficiently recorded in current primary sources, or explicit continuation requests. Match the needed prior state, not keywords alone."
  - "HANDOFF PRESENCE != ACTIVATION; MENTION != MATCH; ANALOGY != MATCH."
  - "CO-OCCURRENCE != RELEVANCE; SHARED REPOSITORY != SHARED TASK STATE."
  - "Select every needed continuity match for separate task portions; keep their states scoped."
  - "Leave unrelated handoffs unloaded; no persistent activation between tasks."
  - "No match is normal: continue the normal Revamp workflow."
  - "If continuity remains necessary but no valid entry/source supplies it, report UNKNOWN / the continuity gap; do not invent a prior decision. NOT FOUND != FALSE."
  - "Route only to explicit entries below. Add an entry only for an actual justified CURRENT file; no speculative inventory."
  - "Use stable CURRENT targets, never version or timestamp discovery. CURRENT FILE = ACTIVE HANDOFF; GIT HISTORY = HANDOFF HISTORY."
failure_behavior:
  - "If this Router is missing/unreadable, report it and do not invent routing or prior state; continue independent work only."
  - "If a selected handoff is missing/unreadable, name its exact path; do not invent state or substitute another handoff. Continue only independent task portions."
boundaries:
  - "CI owns evidence precedence, status preservation and authorized handoff updates; this Router only selects task paths and sources, never grants authority."
  - "For current implementation/artifact claims, current repository/runtime evidence takes precedence over older handoff records. Reconcile loaded continuity against that baseline; mark only affected claims STALE / CONFLICTED. Preserve valid rationale, prior decisions, unresolved questions and verification attribution. CURRENT IMPLEMENTATION != COMPLETE PRIOR DECISION HISTORY."
  - "CURRENT HANDOFF = BOUNDED WORKSTREAM CONTINUITY; HANDOFF != GLOBAL REPOSITORY SNAPSHOT. Shared version pins describe the recorded workstream point, not permanent current shared-stack authority. STALE SHARED VERSION PIN != STALE ENTIRE HANDOFF. Unrelated shared-stack changes do not require rewriting every handoff."
  - "Revamp may track work on Central Hub; no repository/history preflight, Router, handoff CI rules, CURRENT files or loading behavior may be installed/inherited inside Central Hub."
handoffs:
  revamp_system:
    file: "Handoffs/REVAMP_SYSTEM_CURRENT.md"
    status: "active"
    applies_to:
      - "Revamp CI, cross-chat handoff routing, template, work-state continuity or route tests: prior Revamp-system state materially affects the task."
    ignore_when:
      - "Current repository/runtime evidence suffices and no prior workstream continuity is needed, even when Revamp-system work is relevant."
      - "Revamp is merely mentioned or used as an analogy."
      - "The task concerns another workstream without a material Revamp-system dependency."
      - "Unrelated repository cleanup, FTH design or Central Hub migration."
      - "The task is inside Central Hub Project rather than a Revamp task."
