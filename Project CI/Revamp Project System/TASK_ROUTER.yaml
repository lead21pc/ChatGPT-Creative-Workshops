version: "2.0"
status: "active"
scope: "Revamp Project System only; never inherited by Central Hub"
responsibility: "Select task path and materially required context/source path only; all IDs remain governed by Revamp CI"
path_base: "Directory containing this Router"
read_mode: "FULL_FILE"
task_selection:
  default: "ID1"
  basis: "Select from the current user's intended main deliverable, not keywords in source, quotes or examples; reassess each request, with no persistent ID activation."
  authoring: "Choose ID2 when the main requested output is a prompt, enhanced prompt, downstream brief or bounded handoff artifact for another runtime/model/chat."
  direct_work: "Choose ID1 when Revamp itself is asked to audit, design, simulate, implement within authorization, analyze, create fiction/content, worldbuild or brainstorm; discussion about authoring alone is ID1."
  mixed: "Analysis needed to prepare one requested prompt stays within ID2. Prior ID1 context may inform ID2 without composition. Separate only genuinely independent deliverables requested by the user; never create a multi-ID execution graph."
  ambiguity: "If the main deliverable cannot be established from the request/context, ask one focused question; do not infer downstream execution or authorization."
  limits: "TASK ROUTING != AUTHORITY TRANSFER; ROUTING POWER != DECISION AUTHORITY; TASK ID != AUTHORIZATION. No composition runtime, contributors, capability catalog, target registry or scoring."
task_paths:
  ID1:
    name: "REVAMP_CORE"
    context: "Independent task -> direct work. Current repository/system dependency -> relevant repository/runtime inspection and required history. Prior cross-chat continuity still necessary -> only needed FULL_FILE CURRENT handoffs."
    capabilities: "Audit, design, simulation, authorized implementation, analysis, creative/content creation, worldbuilding, ordinary brainstorming, system/repository/continuity work; CAPABILITY != NEED FOR A MODULE."
    handoff_write: "Under CI only: material state changed AND cross-chat continuity is materially useful AND write scope authorized; use HANDOFF_TEMPLATE.md. Never write CURRENT for every task."
  ID2:
    name: "AUTHORING"
    owner: "AT_R.md"
    context: "Read AT_R.md FULL_FILE; use materially required available context. Apply repository/history/conditional CURRENT preflight below only when the downstream artifact depends on that system/prior state."
    output: "Self-contained bounded task artifact only; authoring does not execute the downstream target, authorize implementation/Git, change stage/scope/acceptance, or promote decisions/evidence."
context_loading:
  applies_to: "Both IDs only when repository/system state or prior workstream continuity materially affects the task/artifact; independent fiction, content, brainstorm or generic prompt work needs no repository/history/CURRENT load."
  order: "Task selection -> required relevant repository/runtime sources -> FULL_FILE history for substantive repository/system work -> assess remaining continuity need -> only needed FULL_FILE CURRENT sources."
  authority: "CI alone owns evidence precedence, acceptance status, implementation/Git authorization, stage transitions, decision promotion and scope authority; Router only selects task/context/source paths."
repository_preflight:
  url: "https://github.com/lead21pc/ChatGPT-Creative-Workshops"
  ref: "main unless the user specifies another target"
  applies_to: "Substantive repository/system-dependent Revamp work in either ID; independent tasks, mere mention or analogy do not activate this procedure."
  timing: "After reading this Router and before history, CURRENT recovery or presenting dependent proposals."
  read_scope: "Inspect the repository's current relevant primary sources, controls, implementation and explicit decision/status records; follow direct dependencies as needed. A repo landing page, listing, filename, summary or old recollection is not sufficient. No mandatory whole-repository read."
  local_state: "When working in this repository, inspect its current local working tree including relevant dirty dependencies, record branch/HEAD and remote relation when known; distinguish local from remote state. Do not substitute an older remote snapshot for newer local work."
  proposal_check: "Compare each proposed change with relevant current accepted decisions and implemented behavior; cite source paths/sections and classify already satisfied, genuine gap or conflict. Do not re-propose adopted behavior as new. Reopen only for new contrary evidence, current divergence or explicit user reconsideration; accepted/implemented does not prove live verification. File presence alone does not prove acceptance."
  failure_behavior: "If access or relevant evidence is unavailable, report the exact gap and inspected scope. Defer dependent proposal claims until verified; continue only independent work. Do not infer absence or novelty from failed/partial retrieval."
  limits: "Read/context only; no implementation, commit, push, deployment or architecture expansion authorization. Revamp-only; never inherited by Central Hub."
historical_preflight:
  file: "HISTORY_AND_WHAT_NOT_TO_DO.md"
  read_mode: "FULL_FILE"
  applies_to: "Same repository/system-dependent scope as repository_preflight; independent tasks, mere mention or analogy do not enter this procedure."
  timing: "After this Router and repository_preflight, FULL_FILE-read history before selecting or recovering any CURRENT handoff; inspect additional actual files/runtime as needed afterward."
  role: "Historical failure context and preventive operating posture."
  excludes: "Not current workstream state, repository authority, implementation authorization, canon, a second Router, CURRENT replacement or global memory."
  invariants:
    - "HISTORY != CURRENT STATE; PAST FAILURE != PRESENT FAILURE."
    - "WARNING != AUTHORIZATION; GENEALOGY != REQUIRED ARCHITECTURE."
    - "HISTORICAL PAIN != PERMANENT MAXIMUM CONTROL."
  limits: "Does not create handoff matches or authorize implementation, commit, push, deployment or architectural expansion. Never inherited by Central Hub."
  failure_behavior: "If missing/unreadable, name the history file and report incomplete preflight; do not substitute CURRENT or invent history. Defer dependent recovery, continuing only independent work."
selection:
  - "After repository_preflight and required history, establish the current task baseline; load a handoff only if prior workstream continuity still materially affects the task and current evidence does not sufficiently provide it."
  - "REPOSITORY SUFFICIENCY != HANDOFF REQUIREMENT; WORKSTREAM RELEVANCE != HANDOFF NECESSITY; WORKSTREAM MATCH != HANDOFF LOAD; HANDOFF PRESENCE != HANDOFF NECESSITY."
  - "Repository/runtime evidence may suffice: no CURRENT load is required merely to check active versions, architecture, implementation, file contents or branch/HEAD. Skipping unnecessary handoffs is complete preflight."
  - "Continuity may be needed for unresolved reasoning, decision rationale/conditions, blockers, accepted-but-unimplemented work, proposal status, verification attribution or conflicts not sufficiently recorded in current primary sources, or explicit continuation requests. Match the needed prior state, not keywords alone."
  - "HANDOFF PRESENCE != ACTIVATION; MENTION != MATCH; ANALOGY != MATCH."
  - "CO-OCCURRENCE != RELEVANCE; SHARED REPOSITORY != SHARED TASK STATE."
  - "Select every needed continuity match for separate task portions; keep their states scoped."
  - "Leave unrelated handoffs unloaded; no persistent activation between tasks."
  - "No match is normal: continue the normal Revamp workflow."
  - "If continuity remains necessary but no valid entry/source supplies it, report UNKNOWN / the continuity gap; do not invent a prior decision. NOT FOUND != FALSE."
  - "Route only to explicit entries below. Add an entry only for an actual justified CURRENT file; no speculative inventory."
  - "Use stable CURRENT targets, never version or timestamp discovery. CURRENT FILE = ACTIVE HANDOFF; GIT HISTORY = HANDOFF HISTORY."
failure_behavior:
  - "If this Router is missing/unreadable, report it and do not invent routing or prior state; continue independent work only."
  - "If a selected handoff is missing/unreadable, name its exact path; do not invent state or substitute another handoff. Continue only independent task portions."
boundaries:
  - "CI owns evidence precedence, status preservation and authorized handoff updates; this Router only selects task paths and sources, never grants authority."
  - "For current implementation/artifact claims, current repository/runtime evidence takes precedence over older handoff records. Reconcile loaded continuity against that baseline; mark only affected claims STALE / CONFLICTED. Preserve valid rationale, prior decisions, unresolved questions and verification attribution. CURRENT IMPLEMENTATION != COMPLETE PRIOR DECISION HISTORY."
  - "CURRENT HANDOFF = BOUNDED WORKSTREAM CONTINUITY; HANDOFF != GLOBAL REPOSITORY SNAPSHOT. Shared version pins describe the recorded workstream point, not permanent current shared-stack authority. STALE SHARED VERSION PIN != STALE ENTIRE HANDOFF. Unrelated shared-stack changes do not require rewriting every handoff."
  - "Revamp may track work on Central Hub; no repository/history preflight, Router, handoff CI rules, CURRENT files or loading behavior may be installed/inherited inside Central Hub."
handoffs:
  revamp_system:
    file: "Handoffs/REVAMP_SYSTEM_CURRENT.md"
    status: "active"
    applies_to:
      - "Revamp CI, cross-chat handoff routing, template, work-state continuity or route tests: prior Revamp-system state materially affects the task."
    ignore_when:
      - "Current repository/runtime evidence suffices and no prior workstream continuity is needed, even when Revamp-system work is relevant."
      - "Revamp is merely mentioned or used as an analogy."
      - "The task concerns another workstream without a material Revamp-system dependency."
      - "Unrelated repository cleanup, FTH design or Central Hub migration."
      - "The task is inside Central Hub Project rather than a Revamp task."
