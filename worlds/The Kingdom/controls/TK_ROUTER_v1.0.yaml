schema_version: 1
status: ACTIVE
router_version: '1.0'
ci_version: '1.0'
upstream_base: '9.0'
core_controls:
  CI:
    stem: TK_CI
    directory: controls
    path: controls/TK_CI_v1.0.md
  PIPELINE:
    stem: TK_AUTHORING_PIPELINE
    directory: controls
    path: controls/TK_AUTHORING_PIPELINE_v1.0.md
  GLOSSARY:
    stem: TK_CONTROL_VOCABULARY_GLOSSARY
    directory: controls
    path: controls/TK_CONTROL_VOCABULARY_GLOSSARY_v1.0.md
runtime:
  entry: PROMPT_ROUTE_ONLY
  stages:
  - PROMPT_ROUTE_ONLY
  - BOOTSTRAP_GATE
  - OWNER_GATE
  - TEMPORAL_GATE
  - SOURCE_LOAD
  - RECONCILIATION
  - ANTI_DRIFT_OVERLAY_GATE
  - PROMPT_EXECUTION
  - PRE_RESPONSE_CHECK
  deployment: NOT_PERFORMED
bootstrap:
  full_file:
  - TK_CURRENT_SOURCE_INDEX.md
  - TK_OPEN_ISSUES_CURRENT.md
  reconciliation_record: TK_RECONCILIATION_RECORD.md
  record_read_when:
  - conflict
  - supersession
  - provenance
  - source replacement
  - authority
  - migration
owners:
  required_header:
  - SOURCE_ID
  - RUNTIME_ROLE
  - ROLE
  - STATUS
  - SCOPE
  - AUTHORITY_BOUNDARY
  - CROSS_OWNER_BOUNDARY
  - LOAD_MODE
  load_mode: FULL_FILE
  current_role: CURRENT_SOURCE
control_selection:
  directory: controls/anti_drift
  files: direct_children_only
  version_order: numeric
  eligible_status: ACTIVE
  ambiguity: SOURCE_LOAD_BLOCKED
  load: FULL_FILE
controls:
- id: TEMPORAL
  stem: TK_Anti_Drift_Temporal_World_State
  select_when: order, pre-state, deltas, accumulated consequences, elapsed time, or future knowledge can change
    the conclusion
  requires: []
  conditional_requires: []
- id: ACTOR
  stem: TK_Anti_Drift_Actor_Knowledge_Reception_Model_Update
  select_when: actor receipt, interpretation, belief, appraisal, or updating materially determines the answer
  requires:
  - RELATION
  conditional_requires:
  - when: time_material
    target: TEMPORAL
  - when: institutional_interface_material
    target: INSTITUTION
  - when: operational_conflict_material
    target: CRISIS
  - when: economic_mechanism_material
    target: ECONOMY
- id: RELATION
  stem: TK_Anti_Drift_State_Relation_Architecture
  select_when: typed relations, owner boundaries, function allocation, or cross-domain effects decide the conclusion
  requires: []
  conditional_requires: []
- id: INSTITUTION
  stem: TK_Anti_Drift_World_Institutional_Logic
  select_when: institutional operation, authority, law, counterintelligence, or failure interfaces materially
    affect the answer
  requires: []
  conditional_requires:
  - when: economic_mechanism_material
    target: ECONOMY
- id: IRL
  stem: TK_Anti_Drift_IRL_Baseline_Divergence
  select_when: real-world countries, institutions, facts, or time-bound references are localized into TK state
  requires: []
  conditional_requires:
  - when: actor_reception_material
    target: ACTOR
- id: ECONOMY
  stem: TK_Anti_Drift_Economy_Trade_Abundance
  select_when: scarcity, value, access, trade, logistics, labor, or economic intervention decides the answer
  requires: []
  conditional_requires: []
- id: BELIEF
  stem: TK_Anti_Drift_Belief_Culture_Divinity
  select_when: cultural/religious meaning, transmission, practice, change, or symbolic recognition decides
    the answer
  requires: []
  conditional_requires:
  - when: actor_reception_material
    target: ACTOR
  - when: institutional_interface_material
    target: INSTITUTION
  - when: economic_mechanism_material
    target: ECONOMY
- id: CRISIS
  stem: TK_Anti_Drift_Strategic_Crisis_Conflict
  select_when: interception, terrorism/proxy action, borders, command, deployment, or escalation affects a
    transition
  requires:
  - TEMPORAL
  - RELATION
  conditional_requires:
  - when: economic_mechanism_material
    target: ECONOMY
- id: NARRATIVE
  stem: TK_Anti_Drift_World_State_Narrative_Assumption_Failure
  select_when: checkpoint design, perspective, payoff, or genre pressure can change the requested reasoning
  requires:
  - TEMPORAL
  - ACTOR
  conditional_requires:
  - when: operational_conflict_material
    target: CRISIS
  - when: belief_culture_material
    target: BELIEF
failures:
  bootstrap_missing: SOURCE_LOAD_BLOCKED
  owner_missing_or_ambiguous: SOURCE_LOAD_BLOCKED
  temporal_basis_missing: BLOCK_DEPENDENT_TRANSITION
  source_unread: SOURCE_LOAD_BLOCKED
  required_control_missing_or_ambiguous: SOURCE_LOAD_BLOCKED
  control_conflict: BLOCK_DEPENDENT_REASONING
  secondary_nondecisive_gap: SOURCE_LOAD_PARTIAL
policies:
  entry: CI owns entry for materially current-dependent lookup, comparison, audit, simulation, design, mutation,
    integration, migration, reconciliation, event/checkpoint work, and IRL application. A self-sufficient generic
    task may bypass routing. Repository ACTIVE does not prove Project deployment.
  prompt_route_only: Identify only the requested operation/stage/scope, checkpoint/interval/time relation,
    candidate owners and actor/country/domain, evidence needs, potential overlays, and canon-change permission.
    Establish no world premise, resolved gap, simulated conclusion, or outcome. Reroute when material scope
    changes.
  bootstrap: Start normal lore access in ChatGPT Library folder "TK Source". FULL_FILE-read the current source
    index and open issues from the applicable current package. FULL_FILE-read the reconciliation record when
    a record_read_when condition can decide the task. Index entries discover owners; issue entries preserve
    gaps, not solutions.
  owner_gate: Establish admitted SOURCE_ID, runtime and semantic roles, status, scope, authority/cross-owner
    boundaries, and load mode from current headers, admission, reconciliation, and scoped author decisions.
    Filename, folder, Library location, Project presence, catalog listing, or date grants no authority. Duplicate/unknown/missing
    decisive identity blocks dependent work. An external identical name is not the same current source. Unsupported
    new input remains UNCONFIRMED. CURRENT_SOURCE does not mean every section is CANON. Admit future actor/event
    owners through scoped review, manifest, header, and index without changing Router core.
  temporal_gate: When time is decisive, establish checkpoint/interval/event, temporal relation, pre/post state,
    future exclusions, and actor-information boundaries before simulation. A current source may preserve historical
    truth unknown to an actor at T. Do not infer time from filename numbering alone. Missing decisive chronology/access
    blocks the transition or requires an explicit conditional proposal.
  source_load: FULL_FILE is the default and only v1.0 load mode. A hit, snippet, header, summary, memory, or
    previous answer does not prove a full read. Preserve qualifiers, exceptions, mixed statuses, and owner
    boundaries. There is no node-closure contract or hard lore-dependency registry. Read materially referenced
    owners when the claim depends on them; mention alone is not dependency. A task-local read does not prove
    package completeness.
  reconciliation: 'CI owns canon/status discipline: latest explicit scoped author decision, accepted current
    controlling source, and explicitly preserved older facts. The record routes provenance and does not resolve
    itself. Preserve CURRENT, HISTORICAL, SUPERSEDED, UNKNOWN, DEFERRED, CONFLICTED, INFERENCE, HYPOTHETICAL,
    PROPOSAL, UNVERIFIED, and source qualifiers. Questions, compatibility, silence, or repetition are not acceptance.
    Unsupported input remains UNCONFIRMED. Withdraw dependent conclusions when an accepted premise changes
    without inventing replacement consequences.'
  access: 'Use the normal order: Library "TK Source", then Project Sources/explicitly supplied current project
    files, then an explicitly authorized task-local external source. Move to a later authorized surface when
    the earlier one is unavailable, insufficient, or a scoped user instruction supplies the relevant current
    source; establish identity/status/scope/owner/reconciliation there before relying on it. Do not fabricate
    Library presence or a successful read. An environment allowing local maintenance reads does not make repository
    files automatic runtime lore. Read permission and access location grant no canon authority. Source_archive
    is excluded from current discovery, loading, fallback, and regeneration. Only explicit provenance/history/audit/recovery
    scope or a current source identifying a historical record permits the relevant historical comparison; missing
    current state never authorizes recovery. Local control-design reads are not canon reads.'
  overlays: Judge semantic applicability after source loading/reconciliation, not from keywords. Select the
    highest explicit ACTIVE numeric version among direct children; never recurse into archives or require a
    candidate lifecycle. Transitively expand requires and conditional edges judged applicable. Unresolved applicability
    cannot be assumed false to bypass a required control. Missing/ambiguous/cyclic required controls block
    dependent reasoning. FULL_FILE-read selected overlays before execution. Glossary is not a runtime prerequisite.
    Overlays grant no canon, source authority, operation, or actor outcome.
  execution: Execute only the requested operation after gates. Pipeline owns transformations/stopping; overlays
    own scoped reasoning. A bounded task does not require a full domain model. Block missing decisive premises
    or branch explicitly; do not use a hypothesis as current fact. Partial loading is valid only for a named
    secondary gap demonstrably unable to change the bounded conclusion. Independent supported work may continue.
  pre_response: Recheck operation/stage, time, actor access/information, current owner statuses, actual read
    evidence, unresolved gaps, overlay boundaries/dependencies, and canon permission. Report the correct evidence
    class. Repository checks prove neither live Library retrieval nor model semantic compliance. REPOSITORY
    ACTIVE != LIBRARY SYNCHRONIZED != LIVE PROJECT DEPLOYED. Never discover/select/load/confirm active CI at
    runtime; core references are maintenance compatibility checks.
source_access:
  primary_library_folder: TK Source
  normal_order:
  - LIBRARY
  - PROJECT_SOURCES
  - AUTHORIZED_EXTERNAL
  external_authorization: TASK_LOCAL_EXPLICIT
  repository_role: MAINTENANCE_NOT_AUTOMATIC_RUNTIME_SOURCE
  location_grants_authority: false
  project_presence_grants_authority: false
  external_name_grants_identity: false
  library_contents_verified: false
  library_synchronization: NOT_PERFORMED
  live_project_deployment: NOT_PERFORMED
